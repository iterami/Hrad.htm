<!doctype html>
<html lang=en>
<meta charset=utf-8>
<meta content="width=device-width,initial-scale=1" name=viewport>
<title>Hrad.htm</title>
<link href=../common/css/core.css rel=stylesheet>

<table>
  <tr class=header>
    <td>Resource
    <td>Amount
    <td>Bonus/Day
    <td>Workers (<span id=unemployed_workers></span>)
  <tr>
    <td>Food
    <td id=food>
    <td id=food_bonus>
    <td><button onclick="alter_workers({type:'food'})" type=button>+</button> <span id=food_workers></span> <button onclick="alter_workers({amount:-1,type:'food'})" type=button>—</button>
  <tr>
    <td>Gold
    <td id=gold>
    <td id=gold_bonus>
    <td><button onclick="alter_workers({type:'gold'})" type=button>+</button> <span id=gold_workers></span> <button onclick="alter_workers({amount:-1,type:'gold'})" type=button>—</button>
  <tr>
    <td>People
    <td id=people>
    <td id=people_bonus>
    <td><button onclick="alter_workers({type:'people'})" type=button>+</button> <span id=people_workers></span> <button onclick="alter_workers({amount:-1,type:'people'})" type=button>—</button>
  <tr>
    <td>Stone
    <td id=stone>
    <td id=stone_bonus>
    <td><button onclick="alter_workers({type:'stone'})" type=button>+</button> <span id=stone_workers></span> <button onclick="alter_workers({amount:-1,type:'stone'})" type=button>—</button>
</table>
<button onclick=new_day() type=button>Start New Day [ENTER]</button>
<div id=day></div>

<script src=../common/js/core.js></script>
<script src=repo.js></script>
